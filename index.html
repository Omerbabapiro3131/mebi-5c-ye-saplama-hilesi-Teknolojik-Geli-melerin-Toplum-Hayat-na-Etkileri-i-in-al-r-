<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEBİ Bot Controller</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
        }

        .card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .copy-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            outline: none;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4);
        }

        .copy-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .success-msg {
            margin-top: 1rem;
            color: #10b981;
            font-size: 0.875rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>MEBİ Bot</h1>
        <p>Aşağıdaki butona basarak güncel kodu anında kopyalayabilirsin.</p>
        
        <button class="copy-btn" id="copyBtn">Kodu Kopyala</button>
        <div class="success-msg" id="msg">Kod başarıyla kopyalandı!</div>
    </div>

    <script>
        const botCode = `const qaPairs = {
    "kültürel değerleri": "kültür",
    "sanal müze": "sanal",
    "aşırı kullanımı": "bağımlılık",
    "yakıt tüketimini": "elektrikli araçlar",
    "telefon icat edilmeden": "duman",
    "merak duygusunu": "hayatı kolaylaştırmak",
    "hızlı rota": "navigasyon sistemleri",
    "sesli rehberlik": "dil",
    "sabanın icadıyla": "hayvan",
    "tekerlek icat edilmeden": "kas gücü",
    "kitap sayısı": "matbaa",
    "araç gereçlere": "teknoloji"
};

function startBot() {
    const allElements = Array.from(document.querySelectorAll('div, span, button'));
    const questionEl = allElements.find(el => el.innerText.includes('___') || (el.innerText.length > 20 && el.innerText.includes(' ')));
    
    if (!questionEl) return;
    const currentQ = questionEl.innerText.toLowerCase();

    for (let key in qaPairs) {
        if (currentQ.includes(key.toLowerCase())) {
            const targetBtn = allElements.find(b => 
                b.innerText.trim().toLowerCase() === qaPairs[key].toLowerCase() && 
                b.offsetWidth > 0 && b.offsetHeight > 0
            );

            if (targetBtn) {
                targetBtn.click();
                ['mousedown', 'mouseup', 'click'].forEach(type => {
                    targetBtn.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true }));
                });
                break;
            }
        }
    }
}

const botRunner = setInterval(startBot, 200);`;

        const btn = document.getElementById('copyBtn');
        const msg = document.getElementById('msg');

        btn.addEventListener('click', () => {
            navigator.clipboard.writeText(botCode).then(() => {
                btn.textContent = 'Kopyalandı!';
                msg.classList.add('show');
                
                setTimeout(() => {
                    btn.textContent = 'Kodu Kopyala';
                    msg.classList.remove('show');
                }, 2000);
            });
        });
    </script>
</body>
</html>
